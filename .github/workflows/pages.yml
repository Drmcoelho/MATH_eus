name: Publica o MATHeu$ no GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - modules/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixa o repositório
        uses: actions/checkout@v6

      - name: Verifica a matemática de todos os laboratórios
        run: |
          for checker in modules/*/check-math.mjs; do
            echo "== $checker"
            node "$checker"
          done

      - name: Prepara apenas os arquivos públicos
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp -R modules _site/modules
          find _site/modules -name 'check-math.mjs' -delete
          touch _site/.nojekyll

      - name: Configura o GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empacota o site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publica
        id: deployment
        uses: actions/deploy-pages@v4
