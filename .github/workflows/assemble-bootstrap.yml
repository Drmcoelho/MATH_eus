name: Assemble MATHeu$ bootstrap

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/assemble-bootstrap.yml

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble repository files
        shell: bash
        run: |
          set -euo pipefail

          cat .bootstrap/AGENTS.part* > AGENTS.md
          mkdir -p docs modules shared tools

          cat > docs/SEASON-01.md <<'EOF_SEASON'
          # Temporada 01 — O cerco do círculo

          ## Pergunta-mãe

          Quanto de geometria, cálculo e inferência pode nascer de uma única configuração: um polígono regular preso entre duas circunferências concêntricas?

          ## Arco cognitivo

          ```text
          forma
          → medida
          → comparação
          → erro
          → garantia
          → limite
          → espaço
          → acumulação
          → variação
          → reciprocidade
          ```

          ## Laboratórios

          ### 01 — Duas circunferências, um polígono

          Entrega cognitiva: reconhecer o triângulo fundamental e deduzir `r/R = cos(π/n)`.

          Interações: número de lados, ruído de medição, inferência inversa.

          ### 02 — Quanto mede o contorno?

          Entrega cognitiva: construir lado e perímetros interno/externo.

          Interações: `n`, normalização por `R` ou `r`, comparação de erros.

          ### 03 — O que acontece com as áreas?

          Entrega cognitiva: construir área por triângulos e comparar os dois cercos.

          Interações: áreas, erros absoluto/relativo, escala linear/log.

          ### 04 — O erro também tem forma

          Entrega cognitiva: tratar erro como objeto e detectar ordem quadrática experimentalmente.

          Interações: `n² × erro`, razão de contração, duplicação de `n`.

          ### 05 — Quando “chegar perto” vira limite?

          Entrega cognitiva: transformar tolerância em garantia.

          Interações: escolha de erro máximo, busca do menor `n`, intervalo de cerco.

          ### 06 — Do polígono ao prisma

          Entrega cognitiva: entender como perímetro vira área lateral e área vira volume.

          Interações: altura, extrusão, prismas inscritos/circunscritos.

          ### 07 — Girar cria espaço

          Entrega cognitiva: reconhecer sólidos de revolução e fatias.

          Interações: perfil, eixo, rotação, cortes.

          ### 08 — Acumular é integrar

          Entrega cognitiva: compreender integral como acumulação refinável.

          Interações: número de fatias, discos/anéis, erro de aproximação.

          ### 09 — Mudar é derivar

          Entrega cognitiva: compreender derivada como contribuição marginal.

          Interações: raio, incremento, coroa, aproximação linear.

          ### 10 — Derivar e integrar são inversos

          Entrega cognitiva: conectar mudança local e reconstrução global.

          Interações: função, taxa, acumulação e recuperação.
          EOF_SEASON

          cat > docs/MIGRATION.md <<'EOF_MIGRATION'
          # Migração seletiva — MATH3us → MATHeu$

          ## Regra

          Não copiar o braço antigo integralmente.

          Migrar conceitos e componentes, não a burocracia.

          ## Fontes prioritárias

          - `MATH3us/arms/matheus-dollar/index.html`
          - `MATH3us/arms/matheus-dollar/MATHeu$.md` ou `MATH3us/MATHeu$.md`
          - `MATH3us/arms/matheus-dollar/EXPANSAO-02-LIMITES-TRIANGULOS-SETORES.md`
          - geradores SVG e rotinas de gráficos já verificadas
          - autópsias de bugs visuais e matemáticos

          ## O que aproveitar

          - triângulo fundamental `R–r–L/2`;
          - alternância inscrito/circunscrito;
          - identidade visual: inscrito verde, circunscrito vermelho tracejado, círculo preto pontilhado;
          - vista local autoajustável;
          - tabelas equivalentes aos gráficos;
          - invariantes geométricos;
          - cálculos de perímetro, área e erros;
          - testes de viewport e ausência de rede.

          ## O que não migrar automaticamente

          - contrato de tratado;
          - organização por capítulos canônicos;
          - ledger completo de claims;
          - releases e tags do MATH3us;
          - texto formal que anteceda a experiência;
          - fórmulas assintóticas no caminho principal;
          - rodapés editoriais extensos;
          - conteúdo que não sobreviva ao teste de uso.

          ## Processo por componente

          1. identificar a pergunta pedagógica;
          2. extrair o algoritmo ou construção;
          3. reescrever a interface para Brinque → Entenda → Oficina;
          4. inserir exercício antes da explicação;
          5. verificar matemática;
          6. auditar desktop e iPhone;
          7. integrar apenas após render real.
          EOF_MIGRATION

          cat > index.html <<'EOF_INDEX'
          <!doctype html>
          <html lang="pt-BR">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <meta name="description" content="MATHeu$ — laboratório visual de intuição matemática.">
            <title>MATHeu$ — Laboratório visual de intuição matemática</title>
            <style>
              :root {
                color-scheme: light dark;
                --bg: #f5f2ea;
                --ink: #151515;
                --muted: #615f59;
                --panel: rgba(255,255,255,.58);
                --line: rgba(20,20,20,.14);
                --accent: #246b52;
              }
              @media (prefers-color-scheme: dark) {
                :root {
                  --bg:#111310; --ink:#f0eee8; --muted:#b7b3aa;
                  --panel:rgba(255,255,255,.05); --line:rgba(255,255,255,.13);
                  --accent:#77c6a2;
                }
              }
              * { box-sizing: border-box; }
              body {
                margin:0; background:var(--bg); color:var(--ink);
                font: 18px/1.55 ui-serif, Georgia, serif;
              }
              main { width:min(980px, calc(100% - 32px)); margin:auto; padding:64px 0 96px; }
              .eyebrow { font: 700 .75rem/1.2 ui-sans-serif, system-ui; letter-spacing:.15em; text-transform:uppercase; color:var(--accent); }
              h1 { font-size:clamp(3rem, 10vw, 7rem); line-height:.9; margin:.2em 0; letter-spacing:-.05em; }
              .lead { font-size:clamp(1.2rem, 3vw, 1.75rem); max-width:760px; color:var(--muted); }
              .question {
                margin:48px 0; padding:32px; border:1px solid var(--line);
                border-radius:24px; background:var(--panel);
              }
              .question strong { display:block; font:700 .75rem/1.2 ui-sans-serif,system-ui; text-transform:uppercase; letter-spacing:.12em; color:var(--accent); }
              .question p { font-size:clamp(1.5rem,4vw,2.6rem); line-height:1.15; margin:.5em 0 0; }
              .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:16px; }
              article { padding:24px; border:1px solid var(--line); border-radius:20px; background:var(--panel); }
              article small { color:var(--accent); font:700 .72rem/1 ui-sans-serif,system-ui; letter-spacing:.1em; }
              article h2 { margin:.5rem 0; font-size:1.35rem; }
              article p { margin:0; color:var(--muted); }
              footer { margin-top:56px; padding-top:24px; border-top:1px solid var(--line); color:var(--muted); }
            </style>
          </head>
          <body>
          <main>
            <p class="eyebrow">Laboratório visual de intuição matemática</p>
            <h1>MATHeu$</h1>
            <p class="lead">A matemática entra pelos olhos, é interrogada pelas mãos e só então recebe fórmula.</p>

            <section class="question">
              <strong>Pergunta de abertura</strong>
              <p>Se eu conheço apenas duas circunferências, consigo descobrir quantos lados tem o polígono entre elas?</p>
            </section>

            <section class="grid" aria-label="Primeira temporada">
              <article><small>LAB 01</small><h2>Duas circunferências</h2><p>Inferir a forma a partir da razão entre os raios.</p></article>
              <article><small>LAB 02</small><h2>Quanto mede o contorno?</h2><p>Construir os perímetros por dentro e por fora.</p></article>
              <article><small>LAB 03</small><h2>O que acontece com as áreas?</h2><p>Transformar lados em triângulos e triângulos em área.</p></article>
              <article><small>LAB 04</small><h2>O erro também tem forma</h2><p>Observar como o erro muda quando o número de lados dobra.</p></article>
              <article><small>LAB 05</small><h2>Quando nasce o limite?</h2><p>Trocar “parece próximo” por uma garantia de tolerância.</p></article>
              <article><small>LAB 06–10</small><h2>Do plano ao cálculo</h2><p>Prismas, volumes, integração, derivação e reciprocidade.</p></article>
            </section>

            <footer>
              <p>Bootstrap inicial. O primeiro laboratório ainda será construído sobre geometria calculada, SVG acessível e exercícios entremeados.</p>
            </footer>
          </main>
          </body>
          </html>
          EOF_INDEX

          cat > .gitignore <<'EOF_GITIGNORE'
          # macOS
          .DS_Store

          # local tooling
          node_modules/
          .playwright/
          coverage/

          # generated audits
          **/audit/*.tmp
          **/audit/local-*
          EOF_GITIGNORE

          touch modules/.gitkeep shared/.gitkeep tools/.gitkeep
          rm -rf .bootstrap

      - name: Commit assembled bootstrap
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'feat: assemble MATHeu$ bootstrap'
          git push
