name: Corrige progresso do Lab 03

on:
  pull_request:
    paths:
      - 'modules/03-areas/**'
      - '.github/workflows/validate.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hotfix:
    if: github.event_name == 'pull_request' && github.head_ref == 'hotfix/lab03-progresso-derivacao'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: hotfix/lab03-progresso-derivacao

      - name: Torna a derivação um marco real
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('modules/03-areas/index.html')
          html = page.read_text(encoding='utf-8')
          html = html.replace('aria-valuemax="9"', 'aria-valuemax="10"', 1)
          html = html.replace('<strong id="progress-text">0/9</strong>', '<strong id="progress-text">0/10</strong>', 1)
          html = html.replace('0/9 movimentos concluídos.', '0/10 movimentos concluídos.', 1)
          html = html.replace(
              'const checkpoints={predicted:false,manipulated:false,revealed:false,audited:false,scaled:false},solved=new Set();',
              'const checkpoints={predicted:false,manipulated:false,revealed:false,derived:false,audited:false,scaled:false},solved=new Set();',
              1
          )
          start = html.index('function progress(){')
          end = html.index('\nfunction label', start)
          progress = "function progress(){const total=(checkpoints.predicted?1:0)+(checkpoints.manipulated?1:0)+(checkpoints.revealed?1:0)+(checkpoints.derived?1:0)+solved.size+(checkpoints.audited?1:0)+(checkpoints.scaled?1:0);const capped=Math.min(10,total);$('#progress-fill').style.width=`${capped/10*100}%`;$('#progress-text').textContent=`${capped}/10`;$('.track').setAttribute('aria-valuenow',capped);$('#finish-status').textContent=capped===10?'10/10. A área foi vista, construída, testada, escalada e auditada.':`${capped}/10 movimentos concluídos.`}"
          html = html[:start] + progress + html[end:]
          marker = "$('#deriv-result').hidden=derivStep!==8;"
          replacement = marker + "if(derivStep===8&&!checkpoints.derived){checkpoints.derived=true;progress()}"
          if marker not in html:
              raise SystemExit('marcador da derivação não encontrado')
          html = html.replace(marker, replacement, 1)
          page.write_text(html, encoding='utf-8')

          check = Path('modules/03-areas/check-math.mjs')
          text = check.read_text(encoding='utf-8')
          marker = "assert.ok(html.includes('role=\"progressbar\"'), 'progresso real deve existir');\n"
          addition = """assert.ok(html.includes('aria-valuemax=\"10\"') && html.includes('>0/10</strong>'), 'progresso deve reservar um marco para fechar a derivação');
          assert.ok(js.includes('derived:false'), 'estado deve registrar a derivação separadamente');
          assert.ok(js.includes("derivStep===8&&!checkpoints.derived"), 'passo final deve creditar a derivação uma única vez');
          """
          if addition.strip() not in text:
              if marker not in text:
                  raise SystemExit('ponto do checker não encontrado')
              text = text.replace(marker, marker + addition)
          check.write_text(text, encoding='utf-8')
          PY

      - name: Restaura o workflow canônico
        run: |
          cat > .github/workflows/validate.yml <<'YAML'
          name: Valida o MATHeu$

          on:
            pull_request:
              paths:
                - 'modules/**'
                - 'atlas/**'
                - 'index.html'
                - '.github/workflows/validate.yml'
            push:
              branches: [main]
              paths:
                - 'modules/**'
                - 'atlas/**'
                - 'index.html'
                - '.github/workflows/validate.yml'
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            matematica:
              runs-on: ubuntu-latest
              steps:
                - name: Baixa o repositório
                  uses: actions/checkout@v6

                - name: Verifica a matemática de todos os laboratórios
                  run: |
                    for checker in modules/*/check-math.mjs; do
                      echo "== $checker"
                      node "$checker"
                    done

                - name: Verifica o atlas pessoal
                  run: node atlas/check-math.mjs
          YAML

      - name: Valida e publica
        run: |
          for checker in modules/*/check-math.mjs; do node "$checker"; done
          node atlas/check-math.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "contabiliza o fechamento da derivação no Lab 03"
          git push origin HEAD:hotfix/lab03-progresso-derivacao
