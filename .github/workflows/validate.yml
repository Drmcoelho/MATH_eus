name: Publica e valida o Lab 07 canônico

on:
  pull_request:
    paths:
      - 'modules/**'
      - 'docs/**'
      - '.tmp/**'
      - '.github/workflows/validate.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publica:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/lab07-canonico'
    runs-on: ubuntu-latest
    steps:
      - name: Baixa o branch real
        uses: actions/checkout@v6
        with:
          ref: agent/lab07-canonico

      - name: Materializa HTML e checker
        run: |
          cat .tmp/lab07-index.part00.b64 .tmp/lab07-index.part01.b64 | base64 -d | gzip -d > modules/07-revolucao/index.html
          base64 -d .tmp/lab07-check.b64 | gzip -d > modules/07-revolucao/check-math.mjs
          rm -f .tmp/lab07-*.b64
          rmdir .tmp 2>/dev/null || true
          test -s modules/07-revolucao/index.html
          test -s modules/07-revolucao/check-math.mjs
          grep -q '<style>' modules/07-revolucao/index.html
          grep -q '<script>' modules/07-revolucao/index.html
          ! grep -q 'src="lab.js"' modules/07-revolucao/index.html
          ! grep -q 'href="lab.css"' modules/07-revolucao/index.html

      - name: Atualiza o placar canônico
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/CANON-STATUS.md')
          s=p.read_text(encoding='utf-8')
          s=s.replace('| T01 · Interlúdio 01·B — Polígono escondido | canônico neste PR |','| T01 · Interlúdio 01·B — Polígono escondido | canônico |')
          s=s.replace('| T01 · Lab 06 — Prisma | canônico neste PR |','| T01 · Lab 06 — Prisma | canônico |')
          old='| T01 · Labs 07–10 | funcionais, a reformar | Matemática e checkers preservados; arquitetura editorial anterior. |'
          new='| T01 · Lab 07 — Revolução | canônico neste PR | Soma de discos, cone, esfera, razão 1:2:3, três Canvas e auditoria de eixo. |\n| T01 · Labs 08–10 | funcionais, a reformar | Matemática e checkers preservados; arquitetura editorial anterior. |'
          if old in s:s=s.replace(old,new)
          s=s.replace('07 → 08 → 09 → 10','08 → 09 → 10')
          marker='- PR #31: canonização do Lab 06 e próximo gate no Lab 07.'
          if '- PR #32:' not in s and marker in s:s=s.replace(marker,marker+'\n- PR #32: canonização do Lab 07 e próximo gate no Lab 08.')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Restaura o workflow canônico
        run: |
          cat > .github/workflows/validate.yml <<'YAML'
          name: Valida o MATHeu$

          on:
            pull_request:
              paths:
                - 'modules/**'
                - 'atlas/**'
                - 'index.html'
                - '.github/workflows/validate.yml'
            push:
              branches: [main]
              paths:
                - 'modules/**'
                - 'atlas/**'
                - 'index.html'
                - '.github/workflows/validate.yml'
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            matematica:
              runs-on: ubuntu-latest
              steps:
                - name: Baixa o repositório
                  uses: actions/checkout@v6

                - name: Verifica a matemática de todos os laboratórios
                  run: |
                    for checker in modules/*/check-math.mjs; do
                      echo "== $checker"
                      node "$checker"
                    done

                - name: Verifica o atlas pessoal
                  run: node atlas/check-math.mjs
          YAML

      - name: Valida todos os checkers
        run: |
          for checker in modules/*/check-math.mjs; do
            echo "== $checker"
            node "$checker"
          done
          node atlas/check-math.mjs

      - name: Publica o commit final
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "canoniza o Lab 07 como máquina de volumes de revolução"
          git push origin HEAD:agent/lab07-canonico
