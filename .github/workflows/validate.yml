name: Publica e valida o Lab 05 canônico

on:
  pull_request:
    paths:
      - 'modules/05-limite/**'
      - 'docs/CANON-STATUS.md'
      - '.tmp/lab05/**'
      - '.github/workflows/validate.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publica-lab05:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/lab05-canonico'
    runs-on: ubuntu-latest
    steps:
      - name: Baixa o branch real
        uses: actions/checkout@v6
        with:
          ref: agent/lab05-canonico

      - name: Materializa o Lab 05 autocontido
        run: |
          cat .tmp/lab05/index.* | base64 -d | gzip -d > modules/05-limite/index.html
          cat .tmp/lab05/check.* | base64 -d | gzip -d > modules/05-limite/check-math.mjs
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/CANON-STATUS.md')
          t=p.read_text(encoding='utf-8')
          old='| T01 · Labs 05–10 | funcionais, a reformar | Matemática e checkers preservados; arquitetura editorial anterior. |'
          new='| T01 · Lab 05 — Garantia e limite | canônico neste PR | HTML autocontido; busca exata, previsão assintótica e certificado rigoroso separados em nove passos. |\n| T01 · Labs 06–10 | funcionais, a reformar | Matemática e checkers preservados; arquitetura editorial anterior. |'
          if old not in t:
              raise SystemExit('linha de estado 05–10 não encontrada')
          t=t.replace(old,new,1)
          t=t.replace('05 → 01·B → 06 → 07 → 08 → 09 → 10','01·B → 06 → 07 → 08 → 09 → 10',1)
          p.write_text(t,encoding='utf-8')
          PY
          rm -rf .tmp/lab05

      - name: Restaura o workflow canônico
        run: |
          cat > .github/workflows/validate.yml <<'YAML'
          name: Valida o MATHeu$

          on:
            pull_request:
              paths:
                - 'modules/**'
                - 'atlas/**'
                - 'index.html'
                - '.github/workflows/validate.yml'
            push:
              branches: [main]
              paths:
                - 'modules/**'
                - 'atlas/**'
                - 'index.html'
                - '.github/workflows/validate.yml'
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            matematica:
              runs-on: ubuntu-latest
              steps:
                - name: Baixa o repositório
                  uses: actions/checkout@v6

                - name: Verifica a matemática de todos os laboratórios
                  run: |
                    for checker in modules/*/check-math.mjs; do
                      echo "== $checker"
                      node "$checker"
                    done

                - name: Verifica o atlas pessoal
                  run: node atlas/check-math.mjs
          YAML

      - name: Executa todos os gates
        run: |
          for checker in modules/*/check-math.mjs; do
            echo "== $checker"
            node "$checker"
          done
          node atlas/check-math.mjs
          test "$(grep -c '<script>' modules/05-limite/index.html)" -eq 1
          ! grep -qE 'src="lab\.js"|href="lab\.css"' modules/05-limite/index.html

      - name: Publica o commit final
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "canoniza o Lab 05 e restaura o validador"
          git push origin HEAD:agent/lab05-canonico
