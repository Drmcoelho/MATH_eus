name: One-shot integrate Atlas v2

on:
  push:
    branches:
      - canon/personalizacao-visual

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mesclar main e preservar o portal atual
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MATH_eus maintenance"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          git merge --no-commit --no-ff origin/main || true

          # Nesses dois arquivos, a main é a fonte de verdade; o script reaplica
          # apenas a entrada e a validação específicas do Atlas.
          if git diff --name-only --diff-filter=U | grep -qx 'index.html'; then
            git checkout --theirs index.html
            git add index.html
          fi
          if git diff --name-only --diff-filter=U | grep -qx '.github/workflows/validate.yml'; then
            git checkout --theirs .github/workflows/validate.yml
            git add .github/workflows/validate.yml
          fi

          unresolved=$(git diff --name-only --diff-filter=U)
          if [ -n "$unresolved" ]; then
            printf 'Conflitos não resolvidos:\n%s\n' "$unresolved"
            exit 1
          fi

          python scripts/one_shot_integrate_atlas.py

          grep -q 'href="atlas/index.html"' index.html
          grep -q 'function breathe()' atlas/index.html
          grep -q "card.dataset.locked==='true'" atlas/index.html
          grep -q '../modules/10-reciprocidade/index.html' atlas/index.html
          grep -q '../modules/s02-04-diferencas/index.html' atlas/index.html

          node atlas/check-math.mjs
          for checker in modules/*/check-math.mjs; do
            echo "== $checker"
            node "$checker"
          done

          rm -f .github/workflows/one-shot-integrate-atlas.yml
          rm -f .github/workflows/one-shot-integrate-atlas-v2.yml
          rm -f scripts/one_shot_integrate_atlas.py

          git add -A
          git commit -m "integra e fortalece o Atlas do Resto"
          git push origin HEAD:canon/personalizacao-visual
