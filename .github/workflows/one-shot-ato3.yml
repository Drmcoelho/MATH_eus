name: One-shot Ato 3 completo

on:
  push:
    branches:
      - agent/lab01-ato3-completo

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruir o Ato 3
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('modules/01-duas-circunferencias/index.html')
          text = path.read_text()

          def once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: esperado 1, encontrado {count}')
              text = text.replace(old, new, 1)

          once(
              ".deriv-grid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:24px;align-items:start;margin-top:22px}.deriv-figure{position:sticky;top:12px;padding:12px;border:1px solid var(--line);border-radius:20px;background:var(--bg)}.deriv-figure svg{width:100%;height:auto;display:block}",
              ".deriv-grid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:24px;align-items:start;margin-top:22px}.deriv-figure{position:sticky;top:12px;padding:12px;border:1px solid var(--line);border-radius:20px;background:var(--bg)}.deriv-figure svg{width:100%;height:auto;display:block}.deriv-caption{min-height:3.2em;margin:10px 4px 2px;color:var(--muted);font:700 .86rem/1.45 ui-sans-serif,system-ui}.step-dots{display:flex;gap:8px;align-items:center}.step-dots button{width:28px;height:28px;padding:0;border:1px solid var(--line);border-radius:50%;background:transparent;color:var(--muted);font:900 .72rem/1 ui-sans-serif,system-ui;cursor:pointer}.step-dots button[aria-current=\"step\"]{border-color:var(--focus);background:var(--focus);color:var(--bg)}",
              'css da figura e navegação'
          )

          once(
              ".chain{list-style:none;margin:0;padding:0;counter-reset:step}.chain li{position:relative;margin:0 0 10px;padding:13px 14px 13px 48px;border:1px solid var(--line);border-radius:15px;opacity:.45}.chain li::before{counter-increment:step;content:counter(step);position:absolute;left:12px;top:13px;display:grid;place-items:center;width:25px;height:25px;border-radius:50%;background:var(--line);font:900 .74rem/1 ui-sans-serif,system-ui}.chain li.active{opacity:1;border-color:var(--focus);background:color-mix(in srgb,var(--focus) 8%,transparent)}.chain li.done{opacity:.78}.chain p{margin:0}.chain details{margin-top:9px;padding:10px 12px;border:1px solid var(--line);border-radius:12px}.chain summary{cursor:pointer;font-weight:800}.stepper{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}",
              ".chain{list-style:none;margin:14px 0 0;padding:0;counter-reset:step}.chain li{display:none;position:relative;margin:0;padding:18px 18px 18px 52px;border:1px solid var(--line);border-radius:18px}.chain li::before{counter-increment:step;content:counter(step);position:absolute;left:14px;top:18px;display:grid;place-items:center;width:27px;height:27px;border-radius:50%;background:var(--line);font:900 .74rem/1 ui-sans-serif,system-ui}.chain li.active{display:block;border-color:var(--focus);background:color-mix(in srgb,var(--focus) 8%,transparent)}.chain p{margin:0}.chain details{margin-top:12px;padding:12px 14px;border:1px solid var(--line);border-radius:13px}.chain summary{cursor:pointer;font-weight:800}.stepper{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 12px;padding:12px;border:1px solid var(--line);border-radius:16px;background:color-mix(in srgb,var(--paper) 88%,transparent)}",
              'css do passo único'
          )

          once(
              '<div class="deriv-figure"><svg id="deriv-svg" viewBox="0 0 480 470" role="img" aria-label="Construção progressiva do triângulo fundamental"><g id="deriv-drawing"></g></svg></div>',
              '<div class="deriv-figure"><svg id="deriv-svg" viewBox="0 0 480 470" role="img" aria-labelledby="deriv-svg-title deriv-caption"><title id="deriv-svg-title">Construção progressiva do triângulo fundamental</title><g id="deriv-drawing"></g></svg><p id="deriv-caption" class="deriv-caption" aria-live="polite"></p></div>',
              'legenda viva'
          )

          pattern = re.compile(r'''          <ol id="chain" class="chain">(.*?)</ol>\n          <div class="stepper"><button id="prev-step" type="button" class="ghost">← anterior</button><button id="next-step" type="button" class="primary">próximo →</button><span id="step-status" class="feedback" aria-live="polite">Passo 1 de 7</span></div>''', re.S)
          match = pattern.search(text)
          if not match:
              raise SystemExit('bloco da corrente não encontrado')
          cards = match.group(1)
          replacement = '''          <div class="stepper" aria-label="Navegação da dedução"><button id="prev-step" type="button" class="ghost">← anterior</button><div id="step-dots" class="step-dots" aria-label="Sete passos da dedução"></div><button id="next-step" type="button" class="primary">próximo →</button><span id="step-status" class="feedback" aria-live="polite">Passo 1 de 7</span></div>
          <ol id="chain" class="chain">''' + cards + '''</ol>'''
          text = pattern.sub(replacement, text, count=1)

          conclusion_old = '''      <div class="formula" aria-label="r dividido por R é igual ao cosseno de pi dividido por n">r/R = cos(π/n)</div>
      <div class="dictionary"><div><strong>r</strong><br>raio que toca os lados</div><div><strong>R</strong><br>raio que passa pelos vértices</div><div><strong>n</strong><br>número de lados</div></div>
      <p><strong>O que a relação faz:</strong> reconhece a forma sem precisar saber o tamanho absoluto.</p>
      <details class="proof"><summary>Prova completa — o alicerce inteiro</summary><h3>Teorema 1 · ida</h3><p>Num polígono regular, a perpendicular OM ao lado cai em seu ponto médio. O ângulo central do lado é 2π/n e OM o bisseta, produzindo ∠MOV = π/n. No triângulo retângulo OMV, OM = r e OV = R. Pela definição de cosseno, cos(π/n)=r/R.</p><p class="qed">∎</p><h3>Teorema 2 · volta</h3><p>Se 3 ≤ m &lt; n, então π/m &gt; π/n. Como o cosseno é estritamente decrescente em (0,π), cos(π/m)&lt;cos(π/n). Portanto dois valores diferentes de n não produzem a mesma razão perfeita: a função n ↦ r/R é injetiva.</p><p class="qed">∎</p><p><strong>Limite da prova:</strong> unicidade não significa separação confortável. As razões ficam cada vez mais próximas de 1; é aí que o instrumento começa a confundir vizinhos.</p></details>'''
          conclusion_new = '''      <div id="deriv-conclusion" hidden>
        <p class="label">Corrente fechada</p>
        <div class="formula" aria-label="r dividido por R é igual ao cosseno de pi dividido por n">r/R = cos(π/n)</div>
        <div class="dictionary"><div><strong>r</strong><br>raio que toca os lados</div><div><strong>R</strong><br>raio que passa pelos vértices</div><div><strong>n</strong><br>número de lados</div></div>
        <p><strong>O que a relação faz:</strong> reconhece a forma sem precisar saber o tamanho absoluto.</p>
        <details class="proof"><summary>Prova completa — o alicerce inteiro</summary><h3>Teorema 1 · ida</h3><p>Num polígono regular, a perpendicular OM ao lado cai em seu ponto médio. O ângulo central do lado é 2π/n e OM o bisseta, produzindo ∠MOV = π/n. No triângulo retângulo OMV, OM = r e OV = R. Pela definição de cosseno, cos(π/n)=r/R.</p><p class="qed">∎</p><h3>Teorema 2 · volta</h3><p>Se 3 ≤ m &lt; n, então π/m &gt; π/n. Como o cosseno é estritamente decrescente em (0,π), cos(π/m)&lt;cos(π/n). Portanto dois valores diferentes de n não produzem a mesma razão perfeita: a função n ↦ r/R é injetiva.</p><p class="qed">∎</p><p><strong>Limite da prova:</strong> unicidade não significa separação confortável. As razões ficam cada vez mais próximas de 1; é aí que o instrumento começa a confundir vizinhos.</p></details>
      </div>'''
          once(conclusion_old, conclusion_new, 'conclusão condicionada')

          function_pattern = re.compile(r'''    function renderDeriv\(\)\{.*?\n    \}\n    \$\('#prev-step'\)''', re.S)
          if not function_pattern.search(text):
              raise SystemExit('função renderDeriv não encontrada')

          function_new = r'''    function renderDeriv(){
      const dots=$('#step-dots');
      if(!dots.children.length){
        chain.forEach((_,i)=>{const b=document.createElement('button');b.type='button';b.textContent=String(i+1);b.setAttribute('aria-label',`Ir ao passo ${i+1}`);b.onclick=()=>{derivStep=i;renderDeriv()};dots.append(b)});
      }
      chain.forEach((li,i)=>{li.hidden=i!==derivStep;li.classList.toggle('active',i===derivStep)});
      $$('#step-dots button').forEach((b,i)=>{if(i===derivStep)b.setAttribute('aria-current','step');else b.removeAttribute('aria-current')});
      $('#prev-step').disabled=derivStep===0;$('#next-step').disabled=derivStep===6;
      $('#step-status').textContent=`Passo ${derivStep+1} de 7${derivStep===6?' — corrente fechada.':''}`;
      $('#deriv-conclusion').hidden=derivStep!==6;

      const g=$('#deriv-drawing'),cx=240,cy=255,R=178,n=+sides.value,t=Math.PI/n,r=R*Math.cos(t),s=derivStep;
      const V1=polar(cx,cy,R,-Math.PI/2-t),V2=polar(cx,cy,R,-Math.PI/2+t),M=polar(cx,cy,r,-Math.PI/2),O=[cx,cy];
      const start=-Math.PI/2-t,pts=Array.from({length:n},(_,i)=>polar(cx,cy,R,start+2*Math.PI*i/n));
      const label=(x,y,txt,anchor='start',size=17,color='currentColor')=>g.append(svg('text',{x,y,'text-anchor':anchor,'font-family':'system-ui','font-size':size,'font-weight':800,fill:color},txt));
      const line=(a,b,color='currentColor',width=3,dash='')=>g.append(svg('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:color,'stroke-width':width,'stroke-dasharray':dash}));
      const point=(p,txt,dx=10,dy=-8)=>{g.append(svg('circle',{cx:p[0],cy:p[1],r:6,fill:'currentColor'}));label(p[0]+dx,p[1]+dy,txt)};
      const arcPath=(radius,a1,a2)=>{const A=polar(cx,cy,radius,a1),B=polar(cx,cy,radius,a2);return `M ${A[0]} ${A[1]} A ${radius} ${radius} 0 0 1 ${B[0]} ${B[1]}`};
      const captions=[
        'A fatia central agora existe como região: dois raios delimitam o ângulo 2π/n.',
        'O ponto de tangência M nasce no lado; OM é raio da circunferência interna e perpendicular ao lado.',
        'As duas metades do lado são mostradas e os dois triângulos congruentes justificam que M é o ponto médio.',
        'O segmento OV é introduzido como raio da circunferência externa: OV = R.',
        'OM bisseta a fatia; o arco destacado é exatamente a metade de 2π/n, portanto π/n.',
        'O triângulo OMV concentra tudo: cateto adjacente r, hipotenusa R e ângulo π/n.',
        'Só agora todos os símbolos existem na figura; a frase visual pode ser comprimida em r/R = cos(π/n).'
      ];
      $('#deriv-caption').textContent=captions[s];
      g.replaceChildren();

      g.append(svg('circle',{cx,cy,r:R,fill:'none',stroke:'currentColor','stroke-width':2,'stroke-dasharray':'3 7',opacity:.45}));
      g.append(svg('polygon',{points:pts.map(p=>p.join(',')).join(' '),fill:'color-mix(in srgb,var(--accent) 5%,transparent)',stroke:'var(--accent)','stroke-width':2.3,opacity:.72}));
      point(O,'O',10,22);

      if(s===0){
        g.append(svg('path',{d:`M ${O[0]} ${O[1]} L ${V1[0]} ${V1[1]} A ${R} ${R} 0 0 1 ${V2[0]} ${V2[1]} Z`,fill:'color-mix(in srgb,var(--focus) 16%,transparent)',stroke:'none'}));
        line(O,V1,'var(--focus)',4);line(O,V2,'var(--focus)',4);point(V1,'V₁',-34,-8);point(V2,'V₂',10,-8);
        g.append(svg('path',{d:arcPath(72,-Math.PI/2-t,-Math.PI/2+t),fill:'none',stroke:'var(--focus)','stroke-width':5}));
        label(cx,cy-86,'2π/n','middle',19,'var(--focus)');
      }

      if(s>=1){
        g.append(svg('circle',{cx,cy,r,fill:'none',stroke:'var(--accent2)','stroke-width':2.5,'stroke-dasharray':'10 7',opacity:.8}));
        line(V1,V2,'var(--accent)',5);line(O,M,'var(--accent2)',5);point(M,'M',10,-10);
        const q=15;g.append(svg('polyline',{points:`${M[0]},${M[1]} ${M[0]+q},${M[1]} ${M[0]+q},${M[1]+q} ${M[0]},${M[1]+q}`,fill:'none',stroke:'var(--focus)','stroke-width':3}));
        label((O[0]+M[0])/2-12,(O[1]+M[1])/2,'r','end',18,'var(--accent2)');
      }

      if(s===2){
        g.append(svg('polygon',{points:[O,V1,M].map(p=>p.join(',')).join(' '),fill:'color-mix(in srgb,var(--accent2) 15%,transparent)',stroke:'var(--accent2)','stroke-width':2}));
        g.append(svg('polygon',{points:[O,M,V2].map(p=>p.join(',')).join(' '),fill:'color-mix(in srgb,var(--focus) 15%,transparent)',stroke:'var(--focus)','stroke-width':2}));
        point(V1,'V₁',-34,-8);point(V2,'V₂',10,-8);
        const A=[(V1[0]+M[0])/2,(V1[1]+M[1])/2],B=[(M[0]+V2[0])/2,(M[1]+V2[1])/2];
        line([A[0],A[1]-9],[A[0],A[1]+9],'var(--focus)',3);line([B[0],B[1]-9],[B[0],B[1]+9],'var(--focus)',3);
        label(A[0],A[1]-16,'L/2','middle',15);label(B[0],B[1]-16,'L/2','middle',15);
      }

      if(s>=3){
        line(O,V2,s===3?'var(--focus)':'currentColor',s===3?6:4);point(V2,'V',10,-8);
        label((O[0]+V2[0])/2+12,(O[1]+V2[1])/2,'R','start',18,s===3?'var(--focus)':'currentColor');
      }

      if(s>=4){
        line(O,M,'var(--accent2)',5);
        g.append(svg('path',{d:arcPath(66,-Math.PI/2,-Math.PI/2+t),fill:'none',stroke:'var(--focus)','stroke-width':5}));
        const P=polar(cx,cy,88,-Math.PI/2+t/2);label(P[0]+4,P[1],'π/n','middle',18,'var(--focus)');
      }

      if(s>=5){
        g.append(svg('polygon',{points:[O,M,V2].map(p=>p.join(',')).join(' '),fill:'color-mix(in srgb,var(--focus) 18%,transparent)',stroke:'var(--focus)','stroke-width':3}));
        label((O[0]+M[0])/2-16,(O[1]+M[1])/2,'adjacente = r','end',14,'var(--accent2)');
        label((O[0]+V2[0])/2+12,(O[1]+V2[1])/2+18,'hipotenusa = R','start',14);
      }

      if(s===6){
        label(cx,438,'cos(π/n) = r/R','middle',23,'var(--focus)');
      }
    }
    $('#prev-step')'''
          text = function_pattern.sub(function_new, text, count=1)

          path.write_text(text)

          check = Path('modules/01-duas-circunferencias/check-math.mjs')
          c = check.read_text()
          marker = "console.log('Lab 01:"
          pos = c.find(marker)
          if pos < 0:
              raise SystemExit('console final do checker não encontrado')
          extra = r'''
const chainBlock = html.match(/<ol id="chain" class="chain">([\s\S]*?)<\/ol>/)?.[1] || '';
assert.equal((chainBlock.match(/<li>/g) || []).length, 7, 'Ato 3 deve conter sete passos');
assert.ok(html.indexOf('id="step-dots"') < html.indexOf('<ol id="chain"'), 'navegação deve aparecer antes do cartão ativo');
assert.ok(html.includes('id="deriv-caption"'), 'figura deve explicar visualmente cada passo');
assert.ok(html.includes('id="deriv-conclusion" hidden'), 'fórmula e prova devem nascer ocultas');
assert.ok(html.includes("$('#deriv-conclusion').hidden=derivStep!==6"), 'conclusão só deve abrir no passo 7');
assert.ok(html.includes('li.hidden=i!==derivStep'), 'somente o passo ativo deve permanecer visível');
assert.ok(html.includes('const V1=polar') && html.includes('const V2=polar'), 'ângulo central deve ter dois raios reais');
assert.ok(html.includes('arcPath(72,-Math.PI/2-t,-Math.PI/2+t)'), 'arco 2π/n deve ser desenhado, não apenas rotulado');
assert.ok(html.includes('L/2') && html.includes('hipotenusa = R'), 'ponto médio e triângulo devem ter testemunhas visuais');

'''
          c = c[:pos] + extra + c[pos:]
          check.write_text(c)
          PY

          node modules/01-duas-circunferencias/check-math.mjs
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('modules/01-duas-circunferencias/index.html').read_text()
          scripts = re.findall(r'<script>([\s\S]*?)</script>', html)
          Path('/tmp/lab01.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/lab01.js

          rm .github/workflows/one-shot-ato3.yml
          git config user.name "MATHeu$ integrador"
          git config user.email "actions@users.noreply.github.com"
          git add modules/01-duas-circunferencias/index.html modules/01-duas-circunferencias/check-math.mjs .github/workflows/one-shot-ato3.yml
          git commit -m "completa visualmente o Ato 3 do Lab 01"
          git push origin HEAD:agent/lab01-ato3-completo
