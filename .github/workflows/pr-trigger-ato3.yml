name: Executa reconstrução do Ato 3

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Executar o integrador preparado
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/one-shot-ato3.yml').read_text().splitlines()
          marker = '        run: |'
          start = source.index(marker) + 1
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in source[start:]) + '\n'
          Path('/tmp/ato3.sh').write_text(script)
          PY
          bash /tmp/ato3.sh
          rm -f .github/workflows/pr-trigger-ato3.yml
          git add .github/workflows/pr-trigger-ato3.yml
          git commit -m "remove gatilho temporário do Ato 3"
          git push origin HEAD:agent/lab01-ato3-completo
